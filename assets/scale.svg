<svg viewBox="0 0 800 232" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering scale metrics: 25K+ users, 250K+ images, 100K+ emails, 50 UAV swarm, 10+ integrations, 40+ mentored" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 12px; fill: #6e7681; letter-spacing: 1.5px; }
    .num { font-size: 34px; font-weight: 700; fill: #58a6ff; }
    .label { font-size: 11px; fill: #8b949e; letter-spacing: 0.5px; }
    .dot { fill: #3fb950; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>

  <rect x="1" y="1" width="798" height="230" rx="10" fill="#0d1117" stroke="#21262d"/>

  <circle class="dot" cx="34" cy="30" r="3.5"/>
  <text x="46" y="34" class="mono title">ENGINEERING AT SCALE</text>
  <line x1="1" y1="48" x2="799" y2="48" stroke="#21262d"/>

  <line x1="267" y1="62" x2="267" y2="204" stroke="#21262d"/>
  <line x1="533" y1="62" x2="533" y2="204" stroke="#21262d"/>
  <line x1="1" y1="128" x2="799" y2="128" stroke="#21262d"/>

  <g text-anchor="middle">
    <text x="133" y="105" class="sans num">25K+</text>
    <text x="133" y="122" class="mono label">USERS SUPPORTED</text>

    <text x="400" y="105" class="sans num">250K+</text>
    <text x="400" y="122" class="mono label">TRAINING IMAGES</text>

    <text x="667" y="105" class="sans num">100K+</text>
    <text x="667" y="122" class="mono label">EMAILS ANALYZED</text>

    <text x="133" y="180" class="sans num" fill="#39c5cf">50</text>
    <text x="133" y="197" class="mono label">UAV SWARM SCALE</text>

    <text x="400" y="180" class="sans num" fill="#39c5cf">10+</text>
    <text x="400" y="197" class="mono label">PLATFORM INTEGRATIONS</text>

    <text x="667" y="180" class="sans num" fill="#39c5cf">40+</text>
    <text x="667" y="197" class="mono label">MEMBERS MENTORED</text>
  </g>
</svg>
