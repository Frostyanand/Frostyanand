<svg viewBox="0 0 760 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Secure UAV command and control network with telemetry flowing from a hardened control hub to six swarm nodes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .cap { font-size: 11px; fill: #6e7681; letter-spacing: 0.5px; }
    .link { stroke: #30475e; stroke-width: 1.4; fill: none; }
    .flow { stroke: #58a6ff; stroke-width: 1.4; fill: none; stroke-dasharray: 5 7; animation: flow 1.8s linear infinite; }
    .node { fill: #161b22; stroke: #58a6ff; stroke-width: 1.5; }
    .node-pulse { fill: #58a6ff; }
    .hub { fill: #0d1117; stroke: #3fb950; stroke-width: 2; }
    .lock { stroke: #3fb950; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes blip { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    .n1 { animation: blip 2.6s ease-in-out infinite; animation-delay: 0s; }
    .n2 { animation: blip 2.6s ease-in-out infinite; animation-delay: 0.35s; }
    .n3 { animation: blip 2.6s ease-in-out infinite; animation-delay: 0.7s; }
    .n4 { animation: blip 2.6s ease-in-out infinite; animation-delay: 1.05s; }
    .n5 { animation: blip 2.6s ease-in-out infinite; animation-delay: 1.4s; }
    .n6 { animation: blip 2.6s ease-in-out infinite; animation-delay: 1.75s; }
  </style>

  <rect x="1" y="1" width="758" height="298" rx="10" fill="#0d1117" stroke="#21262d"/>

  <!-- links: hub at 380,150 -->
  <path class="link" d="M380,150 L560,86"/>
  <path class="link" d="M380,150 L636,150"/>
  <path class="link" d="M380,150 L560,214"/>
  <path class="link" d="M380,150 L200,214"/>
  <path class="link" d="M380,150 L124,150"/>
  <path class="link" d="M380,150 L200,86"/>

  <path class="flow" d="M380,150 L560,86"/>
  <path class="flow" d="M380,150 L636,150"/>
  <path class="flow" d="M380,150 L560,214"/>
  <path class="flow" d="M380,150 L200,214"/>
  <path class="flow" d="M380,150 L124,150"/>
  <path class="flow" d="M380,150 L200,86"/>

  <!-- swarm nodes -->
  <g>
    <circle class="node" cx="560" cy="86" r="9"/>
    <circle class="node-pulse n1" cx="560" cy="86" r="3"/>

    <circle class="node" cx="636" cy="150" r="9"/>
    <circle class="node-pulse n2" cx="636" cy="150" r="3"/>

    <circle class="node" cx="560" cy="214" r="9"/>
    <circle class="node-pulse n3" cx="560" cy="214" r="3"/>

    <circle class="node" cx="200" cy="214" r="9"/>
    <circle class="node-pulse n4" cx="200" cy="214" r="3"/>

    <circle class="node" cx="124" cy="150" r="9"/>
    <circle class="node-pulse n5" cx="124" cy="150" r="3"/>

    <circle class="node" cx="200" cy="86" r="9"/>
    <circle class="node-pulse n6" cx="200" cy="86" r="3"/>
  </g>

  <!-- secure hub -->
  <circle class="hub" cx="380" cy="150" r="20"/>
  <path class="lock" d="M373,148 v-6 a7,7 0 0 1 14,0 v6"/>
  <rect class="lock" x="371" y="148" width="18" height="13" rx="2"/>

  <line x1="1" y1="266" x2="759" y2="266" stroke="#21262d"/>
  <text x="380" y="286" text-anchor="middle" class="mono cap">SECURE C2 &#183; 50-NODE SWARM &#183; POST-QUANTUM SECURED</text>
</svg>
