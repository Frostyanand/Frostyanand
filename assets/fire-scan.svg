<svg viewBox="0 0 760 260" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simulated CCTV feed with a scanning line and a highlighted flame detection" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .cap { font-size: 11px; fill: #6e7681; letter-spacing: 0.5px; }
    .rec { fill: #f0883e; animation: blink 1s steps(1) infinite; }
    .rec-text { font-size: 10px; fill: #f0883e; letter-spacing: 0.5px; }
    .scan { animation: sweep 3.4s linear infinite; }
    .box { stroke: #f0883e; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; animation: pulse 1.6s ease-in-out infinite; }
    .corner { stroke: #f0883e; stroke-width: 2; fill: none; opacity: 0.7; }

    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes sweep { 0% { transform: translateY(0); } 100% { transform: translateY(178px); } }
  </style>

  <rect x="1" y="1" width="758" height="258" rx="10" fill="#0d1117" stroke="#21262d"/>

  <!-- camera frame -->
  <rect x="24" y="24" width="712" height="182" rx="6" fill="#010409" stroke="#21262d"/>

  <!-- silhouette skyline -->
  <g fill="#161b22">
    <rect x="60" y="140" width="70" height="66"/>
    <rect x="150" y="110" width="50" height="96"/>
    <rect x="220" y="150" width="90" height="56"/>
    <rect x="560" y="120" width="60" height="86"/>
    <rect x="630" y="150" width="80" height="56"/>
  </g>

  <!-- flame glyph (the detected object) -->
  <g transform="translate(345,150)">
    <path d="M14,44 C4,44 -2,34 2,22 C4,16 10,12 10,4 C16,10 20,18 16,26 C22,24 26,16 24,8 C34,20 32,38 20,44 C24,36 20,30 14,30 C16,36 12,40 14,44 Z"
          fill="#da3633"/>
    <path d="M14,40 C9,40 6,34 8,27 C10,31 13,32 13,28 C16,31 16,36 14,40 Z" fill="#f0883e"/>
  </g>
  <rect class="box" x="330" y="148" width="56" height="52"/>

  <!-- scanning line -->
  <g class="scan">
    <rect x="24" y="24" width="712" height="3" fill="#f0883e" opacity="0.65"/>
  </g>

  <!-- viewfinder corners -->
  <path class="corner" d="M24,44 V24 H44"/>
  <path class="corner" d="M716,24 H736 V44"/>
  <path class="corner" d="M736,186 V206 H716"/>
  <path class="corner" d="M44,206 H24 V186"/>

  <circle class="rec" cx="700" cy="40" r="4"/>
  <text x="690" y="44" text-anchor="end" class="mono rec-text">SCAN</text>

  <line x1="1" y1="222" x2="759" y2="222" stroke="#21262d"/>
  <text x="380" y="242" text-anchor="middle" class="mono cap">YOLOv8 &#183; 250K+ IMAGES &#183; REAL-TIME CCTV DETECTION</text>
</svg>
