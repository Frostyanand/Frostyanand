<svg viewBox="0 0 620 70" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal footer noting the workspace stays idle between builds" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .cmd { font-size: 12px; fill: #6e7681; }
    .cursor { fill: #58a6ff; animation: blink 1s steps(1) infinite; }
    .dot { fill: #d29922; animation: pulse 3.4s ease-in-out infinite; }
    .state { font-size: 10px; fill: #d29922; letter-spacing: 0.5px; }
    .fade { animation: breathe 4.5s ease-in-out infinite; }

    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  </style>

  <rect x="1" y="1" width="618" height="68" rx="9" fill="#0d1117" stroke="#21262d"/>

  <g class="fade">
    <text x="24" y="40" class="mono cmd">&gt; process running in the background...</text>
  </g>
  <rect class="cursor" x="292" y="30" width="6" height="12"/>

  <circle class="dot" cx="580" cy="35" r="4"/>
  <text x="568" y="39" text-anchor="end" class="mono state">IDLE</text>
</svg>
