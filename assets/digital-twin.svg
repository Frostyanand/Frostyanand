<svg viewBox="0 0 760 260" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isometric GIS grid with crowd-flow network nodes and a coverage radius over a simulated campus" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .cap { font-size: 11px; fill: #6e7681; letter-spacing: 0.5px; }
    .grid { stroke: #21262d; stroke-width: 1; }
    .link { stroke: #39c5cf; stroke-width: 1.2; opacity: 0.7; }
    .node { fill: #0d1117; stroke: #39c5cf; stroke-width: 1.5; }
    .coverage { stroke: #58a6ff; stroke-width: 1; stroke-dasharray: 3 4; fill: none; opacity: 0.6; }
  </style>

  <rect x="1" y="1" width="758" height="258" rx="10" fill="#0d1117" stroke="#21262d"/>

  <!-- isometric ground grid -->
  <g class="grid">
    <path d="M80,190 L380,40 L680,190" fill="none"/>
    <path d="M140,206 L380,72 L620,206" fill="none"/>
    <path d="M200,222 L380,104 L560,222" fill="none"/>
    <path d="M260,236 L380,136 L500,236" fill="none"/>
    <path d="M80,190 L200,222 L200,86 L80,190" fill="none"/>
    <path d="M140,72 L260,40 L620,206 L500,236" fill="none"/>
    <path d="M200,86 L620,206" fill="none"/>
    <path d="M260,40 L500,236" fill="none"/>
  </g>

  <!-- network nodes: crowd-flow tracking points -->
  <circle class="node" cx="230" cy="150" r="6"/>
  <circle class="node" cx="330" cy="100" r="6"/>
  <circle class="node" cx="420" cy="170" r="6"/>
  <circle class="node" cx="500" cy="120" r="6"/>
  <circle class="node" cx="560" cy="180" r="6"/>

  <path class="link" d="M230,150 L330,100 L420,170 L500,120 L560,180"/>

  <circle class="coverage" cx="420" cy="170" r="46"/>

  <line x1="1" y1="222" x2="759" y2="222" stroke="#21262d"/>
  <text x="380" y="242" text-anchor="middle" class="mono cap">CESIUM GIS &#183; 6G-NATIVE LAYER &#183; AGENTIC CROWD-FLOW ANALYSIS</text>
</svg>
