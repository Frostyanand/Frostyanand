<svg viewBox="0 0 760 132" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal panel showing workspace initialization and an online status" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .chrome-dot { opacity: 0.55; }
    .win-label { font-size: 11px; fill: #6e7681; letter-spacing: 0.4px; }
    .prompt { font-size: 13px; fill: #58a6ff; }
    .cmd { font-size: 13px; fill: #c9d1d9; }
    .ok { fill: #3fb950; }
    .cursor { fill: #58a6ff; animation: blink 1s steps(1) infinite; }
    .live-dot { fill: #3fb950; animation: pulse 2.4s ease-in-out infinite; }
    .live-text { font-size: 12px; fill: #3fb950; letter-spacing: 0.5px; }

    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    @keyframes revealA { 0% { width: 0; } 10% { width: 300px; } 92% { width: 300px; } 100% { width: 0; } }
    @keyframes revealB { 0% { width: 0; } 28% { width: 0; } 38% { width: 330px; } 92% { width: 330px; } 100% { width: 0; } }
    @keyframes revealC { 0% { width: 0; } 46% { width: 0; } 56% { width: 150px; } 92% { width: 150px; } 100% { width: 0; } }

    #clipA rect { animation: revealA 9s steps(60) infinite; }
    #clipB rect { animation: revealB 9s steps(60) infinite; }
    #clipC rect { animation: revealC 9s steps(60) infinite; }
  </style>

  <defs>
    <clipPath id="clipA"><rect x="0" y="0" width="0" height="20"/></clipPath>
    <clipPath id="clipB"><rect x="0" y="0" width="0" height="20"/></clipPath>
    <clipPath id="clipC"><rect x="0" y="0" width="0" height="20"/></clipPath>
  </defs>

  <rect x="1" y="1" width="758" height="130" rx="10" fill="#0d1117" stroke="#21262d"/>

  <circle class="chrome-dot" cx="24" cy="23" r="5" fill="#f85149"/>
  <circle class="chrome-dot" cx="42" cy="23" r="5" fill="#d29922"/>
  <circle class="chrome-dot" cx="60" cy="23" r="5" fill="#3fb950"/>
  <text x="734" y="27" text-anchor="end" class="mono win-label">workspace.env</text>

  <line x1="1" y1="40" x2="759" y2="40" stroke="#21262d"/>

  <g transform="translate(24,60)" clip-path="url(#clipA)">
    <text class="mono prompt">&gt; <tspan class="mono cmd">initializing workspace...</tspan></text>
  </g>
  <g transform="translate(24,84)" clip-path="url(#clipB)">
    <text class="mono prompt">&gt; <tspan class="mono cmd">loading systems, projects, research...</tspan></text>
  </g>
  <g transform="translate(24,108)" clip-path="url(#clipC)">
    <text class="mono prompt">&gt; <tspan class="mono cmd">status: </tspan><tspan class="mono ok">online</tspan></text>
  </g>
  <rect class="cursor" x="176" y="98" width="7" height="13"/>

  <circle class="live-dot" cx="716" cy="112" r="4"/>
  <text x="726" y="116" class="mono live-text">LIVE</text>
</svg>
