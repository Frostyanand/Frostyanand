<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-label="Workaholic academic scheduling system">
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.dim{fill:#8b949e}.line{stroke:#30363d}.flow{stroke:#58a6ff;stroke-width:1.5;stroke-dasharray:5 7;animation:flow 2.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}</style>
  <rect x="1" y="1" width="758" height="188" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="25" y="29" class="m" fill="#58a6ff" font-size="11" letter-spacing="1">WORKAHOLIC</text>
  <text x="735" y="29" text-anchor="end" class="m" fill="#3fb950" font-size="10" letter-spacing=".8">● ACTIVE BUILD</text>
  <path d="M1 45H759M1 154H759" class="line"/>
  <text x="25" y="73" class="s" fill="#f0f6fc" font-size="16">Academic scheduling for the schedule students actually have.</text>
  <g class="m" font-size="10" letter-spacing=".5">
    <rect x="25" y="98" width="132" height="34" rx="5" fill="#161b22" stroke="#30363d"/><text x="91" y="119" text-anchor="middle" fill="#c9d1d9">COURSES</text>
    <rect x="213" y="98" width="158" height="34" rx="5" fill="#161b22" stroke="#30363d"/><text x="292" y="119" text-anchor="middle" fill="#c9d1d9">RECURRING RULES</text>
    <rect x="427" y="98" width="142" height="34" rx="5" fill="#161b22" stroke="#30363d"/><text x="498" y="119" text-anchor="middle" fill="#c9d1d9">CONSTRAINTS</text>
    <rect x="625" y="98" width="110" height="34" rx="5" fill="#10243a" stroke="#58a6ff"/><text x="680" y="119" text-anchor="middle" fill="#f0f6fc">CALENDAR</text>
  </g>
  <path d="M157 115H213M371 115H427M569 115H625" class="flow" fill="none"/>
  <text x="25" y="176" class="m dim" font-size="10">SEMESTER MANAGEMENT · DAY ORDER · CALENDAR GENERATION · SHIFTING CONSTRAINTS</text>
</svg>
